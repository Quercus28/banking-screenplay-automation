buildscript {
    repositories {
        mavenCentral()
    }
        dependencies {
        classpath("net.serenity-bdd:serenity-gradle-plugin:3.3.4")
    }
}

plugins {
	id 'io.github.jumosqu12.screenplayarchitecture' version '2.0.1'
	id 'java'
    id 'eclipse'
    id 'idea'
}

group 'co.edu.udea.certificacion'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    // JitPack is only needed for the serenity-captions library (captions panel used by "gradlew serenityCaptions").
    // Source and docs: https://github.com/Quercus28/serenity-captions
    maven { url 'https://jitpack.io' }
}

ext {
    serenityVersion = '4.1.0'
    serenityCucumberVersion = '4.1.0'
    lombokVersion = '1.18.22'
    junit = '4.13.2'
    hamcrest = '1.3'
    serenityWebVersion = '4.1.0'
}

dependencies {
    implementation "net.serenity-bdd:serenity-core:$rootProject.ext.serenityVersion"
    implementation "net.serenity-bdd:serenity-junit:$rootProject.ext.serenityVersion"
    implementation "net.serenity-bdd:serenity-screenplay:$rootProject.ext.serenityVersion"
    implementation "net.serenity-bdd:serenity-cucumber:$rootProject.ext.serenityCucumberVersion"
    implementation 'org.slf4j:slf4j-simple:2.0.5'
    implementation "net.serenity-bdd:serenity-screenplay-webdriver:$rootProject.ext.serenityWebVersion"

    //Test compilation
    testImplementation "junit:junit:$rootProject.ext.junit"
    testImplementation "org.hamcrest:hamcrest-all:$rootProject.ext.hamcrest"
    implementation 'org.slf4j:slf4j-simple:2.0.5'
    testImplementation("io.github.bonigarcia:webdrivermanager:5.4.1")

    // Captions panel for presenting the tests (gradlew serenityCaptions)
    testImplementation 'com.github.Quercus28:serenity-captions:1.0.0'

    //Lombok dependencies
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor  "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly  "org.projectlombok:lombok:${lombokVersion}"

    //Additional library
    implementation group: 'org.apache.commons', name: 'commons-dbcp2', version: '2.12.0'

}

tasks.named('test') {
    // System configs
    mustRunAfter 'clean'

    // Optional filter: -Dtags="@HAL-03"
    def tags = System.getProperty('tags')
    if (tags) {
        systemProperty 'cucumber.filter.tags', tags
    }
}

apply plugin: 'net.serenity-bdd.serenity-gradle-plugin'

def failedScenarios = 0
tasks.named('test') {
    afterSuite { suite, result ->
        if (suite.parent == null) {
            failedScenarios = result.failedTestCount
        }
    }
}

// Two commands to run the suite:
//   ./gradlew serenity           -> without captions
//   ./gradlew serenityCaptions   -> with captions (pauses on every step)
[
        serenity        : 'Runs the Serenity tests WITHOUT captions and builds the report',
        serenityCaptions: 'Runs the Serenity tests WITH captions and builds the report'
].each { taskName, taskDescription ->
    tasks.register(taskName) {
        group = 'serenity'
        description = taskDescription
        dependsOn 'clean', 'test', 'aggregate'
        doLast {
            if (failedScenarios > 0) {
                throw new GradleException("${failedScenarios} scenario(s) failed. " +
                        "Report: target/site/serenity/index.html")
            }
        }
    }
}

tasks.named('aggregate') {
    mustRunAfter 'test'
}

gradle.taskGraph.whenReady { graph ->
    // Only these two commands override serenity.conf; plain "gradlew test" keeps using it.
    def captions = graph.hasTask(':serenityCaptions')
    if (captions || graph.hasTask(':serenity')) {
        tasks.test.systemProperty 'captions.enabled', captions.toString()
        // Always build the report; the serenity/serenityDemo task fails the build afterwards if a scenario failed.
        tasks.test.ignoreFailures = true
    }
}
