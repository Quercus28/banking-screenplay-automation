serenity {
    take.screenshots = FOR_FAILURES
    use.unique.browser = true
    test.root = co.edu.udea.certificacion.banking
    console.colors = true
    report {
        accessibility = true
    }
    requirement {
        types = "epic, feature"
    }
}

# Serenity Captions (https://github.com/Quercus28/serenity-captions): shows in the browser the
# scenario, the Gherkin step and the Screenplay actions being run, with a pause after each one.
# "gradlew serenity" turns it off and "gradlew serenityCaptions" turns it on, whatever is set here.
captions {
  enabled = false
  step.pause.ms = 1800
  action.pause.ms = 700
  result.pause.ms = 3000
}

#headless.mode = true

webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
  }
}

chrome.switches = """--start-maximized;--test-type;--no-sandbox;--ignore-certificate-errors;
                   --disable-popup-blocking;--disable-default-apps;--disable-extensions-file-access-check;
                   --incognito;--disable-infobars,--disable-gpu;--remote-allow-origins=*"""

pages {
    swaglabsUrl = "https://www.globalsqa.com/angularJs-protractor/BankingProject/"
}